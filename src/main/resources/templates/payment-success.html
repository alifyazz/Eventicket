<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Success - EventTicket</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        .centered-qrcode { display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .user-dropdown { position: relative; display: inline-block; }
        .user-menu { display: none; position: absolute; right: 0; top: 120%; background: #fff; min-width: 220px; box-shadow: 0 4px 24px rgba(0,0,0,0.12); border-radius: 12px; z-index: 100; padding: 0.5rem 0; }
        .user-dropdown.open .user-menu { display: block; }
        .user-menu a, .user-menu button { display: flex; align-items: center; gap: 10px; padding: 10px 18px; color: #222; text-decoration: none; background: none; border: none; width: 100%; text-align: left; font-size: 1rem; cursor: pointer; }
        .user-menu a:hover, .user-menu button:hover { background: #f4f6fb; }
        .user-avatar { background: #ffd600; color: #222; font-weight: bold; border-radius: 50%; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; margin-right: 10px; }
        .user-name { font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand" href="/">EventTicket</a>
            <div class="user-dropdown" id="userDropdown">
                <span class="user-avatar">A</span>
                <span class="user-name" onclick="toggleUserMenu()">Alifya Azzahra</span>
                <div class="user-menu" id="userMenu">
                    <a href="#"><span class="bi bi-person"></span> Akun saya</a>
                    <a href="/my-bookings.html"><span class="bi bi-briefcase"></span> Pemesanan & Trip</a>
                    <a href="#"><span class="bi bi-gift"></span> Program loyalitas Genius</a>
                    <a href="#"><span class="bi bi-wallet2"></span> Rewards & Wallet</a>
                    <a href="#"><span class="bi bi-chat-dots"></span> Ulasan</a>
                    <a href="#"><span class="bi bi-heart"></span> Favorit</a>
                    <form th:action="@{/logout}" method="post" style="margin:0;">
                        <button type="submit"><span class="bi bi-box-arrow-right"></span> Logout</button>
                    </form>
                </div>
            </div>
        </div>
    </nav>
    <div class="container py-5">
        <div class="alert alert-success text-center">Booking & Payment successful! Your booking ID is: <span id="bookingId"></span></div>
        <div id="eventDetails" class="mb-4"></div>
        <div class="centered-qrcode mb-3">
            <div class="mb-2">Tunjukkan QR code ini ke panitia saat check-in:</div>
            <div id="qrcode"></div>
        </div>
        <div class="text-center">
            <a href="/my-bookings.html" class="btn btn-outline-primary">Lihat Riwayat Pemesanan</a>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.js"></script>
    <script>
    // User dropdown
    function toggleUserMenu() {
        document.getElementById('userDropdown').classList.toggle('open');
    }
    document.addEventListener('click', function(e) {
        if (!document.getElementById('userDropdown').contains(e.target)) {
            document.getElementById('userDropdown').classList.remove('open');
        }
    });
    // Ambil data bookingId dan qrCode dari query string
    const params = new URLSearchParams(window.location.search);
    const bookingId = params.get('bookingId');
    const qrCode = params.get('qrCode');
    document.getElementById('bookingId').textContent = bookingId;
    if (qrCode) {
        new QRCode(document.getElementById('qrcode'), { text: qrCode, width: 180, height: 180 });
    }
    // Ambil detail event dari API booking
    async function loadEventDetails() {
        if (!bookingId) return;
        const res = await fetch(`/api/bookings/${bookingId}`);
        if (!res.ok) return;
        const booking = await res.json();
        const event = booking.event;
        document.getElementById('eventDetails').innerHTML = `
            <div class="card mx-auto mb-3" style="max-width: 480px;">
                <div class="card-body">
                    <h5 class="card-title mb-2">${event.title}</h5>
                    <div><strong>Lokasi:</strong> ${event.venue}</div>
                    <div><strong>Tanggal:</strong> ${new Date(event.eventDate).toLocaleString()}</div>
                    <div><strong>Harga Tiket:</strong> Rp ${event.ticketPrice}</div>
                    <div><strong>Jumlah Tiket:</strong> ${booking.numberOfTickets}</div>
                    <div><strong>Total Bayar:</strong> Rp ${booking.totalAmount}</div>
                </div>
            </div>
        `;
    }
    loadEventDetails();
    </script>
</body>
</html>
