<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings - EventTicket</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        .booking-card { display: flex; flex-wrap: wrap; border: 1.5px solid #e0e7ef; border-radius: 16px; padding: 24px 18px; margin-bottom: 28px; background: #fff; box-shadow: 0 2px 12px rgba(30,144,255,0.06); }
        .booking-info { flex: 1 1 220px; min-width: 220px; }
        .booking-qr { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 180px; margin-left: 32px; }
        .booking-qr .qrcode { margin-bottom: 12px; }
        @media (max-width: 768px) {
            .booking-card { flex-direction: column; align-items: stretch; }
            .booking-qr { margin-left: 0; margin-top: 18px; }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">EventTicket</a>
        </div>
    </nav>
    <div class="container py-5">
        <div class="mb-4">
            <a href="/" class="btn btn-outline-secondary">&larr; Back to Home</a>
        </div>
        <h2 class="mb-4">Ticket Booking History</h2>
        <div id="bookingList"></div>
    </div>
    <script>
    function formatRupiah(angka) {
        return 'Rp ' + Number(angka).toLocaleString('id-ID');
    }
    async function loadBookings() {
        const res = await fetch('/api/bookings/user/me');
        if (!res.ok) {
            document.getElementById('bookingList').innerHTML = '<div class="alert alert-warning">Not logged in or no data.</div>';
            return;
        }
        const bookings = await res.json();
        if (!bookings.length) {
            document.getElementById('bookingList').innerHTML = '<div class="alert alert-info">No ticket bookings yet.</div>';
            return;
        }
        document.getElementById('bookingList').innerHTML = bookings.map(b => `
            <div class="booking-card">
                <div class="booking-info">
                    <h5 class="card-title mb-2">${b.event.title}</h5>
                    <div class="mb-1"><strong>Status:</strong> <span class="badge bg-${b.status==='PAID'?'warning':b.status==='APPROVED'?'success':'secondary'}">${b.status}</span></div>
                    <div class="mb-1"><strong>Redeem Status:</strong> <span class="badge bg-${b.redeemStatus==='APPROVED'?'success':'secondary'}">${b.redeemStatus}</span></div>
                    <div class="mb-1"><strong>Tickets:</strong> ${b.numberOfTickets}</div>
                    <div class="mb-1"><strong>Total:</strong> ${formatRupiah(b.totalAmount)}</div>
                    <div class="mb-1"><strong>Payment Method:</strong> ${b.paymentMethod}</div>
                    <div class="mb-1"><strong>Booking Date:</strong> ${new Date(b.bookingDate).toLocaleString()}</div>
                </div>
                <div class="booking-qr">
                    ${b.qrCode ? `<div class="qrcode" id="qr${b.id}"></div>` : ''}
                    ${b.status==='PAID' && b.qrCode && b.redeemStatus!=='APPROVED' ? `<button class="btn btn-success mt-2 w-100" onclick="scanQr('${b.qrCode}')">Scan QR (Demo Committee)</button>` : ''}
                </div>
            </div>
        `).join('');
        bookings.forEach(b => {
            if (b.qrCode) new QRCode(document.getElementById('qr'+b.id), { text: b.qrCode, width: 120, height: 120 });
        });
    }
    async function scanQr(qr) {
        if (!confirm('Scan this QR? (Demo committee)')) return;
        const res = await fetch(`/api/bookings/scan-qr?qr=${encodeURIComponent(qr)}`, { method: 'POST' });
        if (res.ok) {
            alert('Ticket successfully approved!');
            loadBookings();
        } else {
            alert('Failed to scan QR: ' + await res.text());
        }
    }
    loadBookings();
    </script>
</body>
</html>
