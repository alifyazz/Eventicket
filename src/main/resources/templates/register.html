<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register</title>
    <style>
        body {
            background: #f4f6fb;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        .container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: #fff;
            padding: 2.5rem 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            width: 350px;
        }
        h2 {
            text-align: center;
            margin-bottom: 1.5rem;
            color: #222;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #333;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 0.7rem;
            margin-bottom: 1.2rem;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 1rem;
            background: #f9fafb;
        }
        button {
            width: 100%;
            padding: 0.8rem;
            background: #3b82f6;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #2563eb;
        }
        .link {
            display: block;
            text-align: center;
            margin-top: 1.2rem;
            color: #3b82f6;
            text-decoration: none;
            font-size: 0.97rem;
        }
        .link:hover {
            text-decoration: underline;
        }
        .error {
            color: #dc2626;
            text-align: center;
            margin-bottom: 1rem;
        }
        .message {
            color: #16a34a;
            text-align: center;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <h2>Register</h2>
        <form th:action="@{/register}" method="post">
            <label>Username:</label>
            <input type="text" name="username" required />
            <label>Password:</label>
            <input type="password" name="password" required />
            <button type="submit">Register</button>
            <div th:if="${error}" th:text="${error}" class="error"></div>
            <div th:if="${message}" th:text="${message}" class="message"></div>
        </form>
        <a th:href="@{/login}" class="link">Sudah punya akun? Login</a>
    </div>
</div>
</body>
</html>
